<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Dashboard - Task Manager</title>
  <style>
    :root { --bg-main:#0f111a; --bg-card:rgba(26,29,46,0.65); --border-color:rgba(255,255,255,0.08); --text-main:#e2e8f0; --text-muted:#747d8c; --accent:#5468ff; --danger:#ff5252; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; margin:0; padding:30px; background:var(--bg-main); color:var(--text-main); }
    .dashboard-header,.card{ background:var(--bg-card); border:1px solid var(--border-color); border-radius:14px; }
    .dashboard-header{ display:flex; justify-content:space-between; align-items:center; padding:18px 22px; margin-bottom:20px; }
    h1{ margin:0; font-size:1.4rem; }
    .muted{ color:var(--text-muted); font-size:.9rem; }
    .card{ padding:18px 22px; margin-bottom:18px; }
    table{ width:100%; border-collapse:collapse; font-size:.9rem; }
    th,td{ padding:10px 8px; border-bottom:1px solid var(--border-color); text-align:left; }
    th{ color:var(--text-muted); font-weight:500; }
    td:last-child,th:last-child{text-align:right}
    .error-empty{ color:var(--text-muted); font-style:italic; }
    .sev-Critical,.sev-Error{ color:var(--danger); }
    .error-group{ border:1px solid var(--border-color); border-radius:10px; padding:8px 10px; margin-bottom:10px; background:rgba(255,255,255,0.02);}
    .error-group summary{ cursor:pointer; font-weight:600; margin-bottom:8px; }
    .count{ color:var(--text-muted); }
    .error-row{ border-top:1px dashed rgba(255,255,255,0.08); padding:8px 0; }
    .sev-tag{ font-weight:700; margin-right:8px; }
    .err-time,.err-id{ color:var(--text-muted); margin-right:10px; font-size:.85rem; }
    .err-msg{ margin-top:4px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div class="dashboard-header">
    <h1>Task Dispatcher</h1>
    <div class="muted">Обновление: каждые 1 сек • URL: /tasks</div>
  </div>

  <div class="card">
    <h2>Top 40 Processes</h2>
    <table>
      <thead><tr><th>PID</th><th>Name</th><th>CPU %</th><th>Memory</th><th>Importance</th></tr></thead>
      <tbody id="processes-body"></tbody>
    </table>
  </div>

  <div class="card">
    <h2>System Errors / Crash Detector (grouped by source)</h2>
    <div id="errors-body" class="error-empty">Загрузка...</div>
  </div>

  <script src="/taskmanager.js"></script>
</body>
</html>
