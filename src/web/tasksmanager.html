<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg-main: #0f111a;
            --bg-card: rgba(26, 29, 46, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #e2e8f0;
            --text-muted: #747d8c;
            --color-success: #00e676;
            --color-warning: #ffb300;
            --color-danger: #ff5252;
            --accent: #5468ff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* ── Header ── */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ── Buttons ── */
        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            text-decoration: none;
        }
        .btn:hover { border-color: var(--accent); background: rgba(84,104,255,0.1); }
        .btn.btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.btn-accent:hover { background: #6678ff; border-color: #6678ff; }
        .btn.btn-danger { background: rgba(255,82,82,0.15); border-color: var(--color-danger); color: var(--color-danger); }
        .btn.btn-danger:hover { background: rgba(255,82,82,0.3); }
        .btn.btn-sm { padding: 6px 11px; font-size: 0.8rem; }

        /* ── Cards ── */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 0;
        }

        /* ── Tracked process list ── */
        #process-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .process-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
        }
        .process-row:hover { border-color: rgba(84,104,255,0.4); background: rgba(84,104,255,0.05); }
        .process-row.selected { border-color: var(--accent); background: rgba(84,104,255,0.1); }
        .process-row.disabled { opacity: 0.5; }

        .process-status-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: background 0.3s;
        }
        .process-status-dot.active { background: var(--color-success); box-shadow: 0 0 6px var(--color-success); }
        .process-status-dot.inactive { background: var(--text-muted); }

        .process-info { flex: 1; min-width: 0; }
        .process-name {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .process-path {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .process-metrics {
            display: flex;
            gap: 16px;
            flex-shrink: 0;
        }
        .proc-metric {
            text-align: right;
        }
        .proc-metric-val {
            font-family: monospace;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .proc-metric-label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .process-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        /* Toggle switch */
        .toggle-switch {
            position: relative;
            width: 38px; height: 20px;
            flex-shrink: 0;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider {
            position: absolute; inset: 0;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle-slider:before {
            content: '';
            position: absolute;
            width: 14px; height: 14px;
            left: 3px; top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s;
        }
        .toggle-switch input:checked + .toggle-slider { background: var(--accent); }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(18px); }

        /* ── Chart section ── */
        #chart-section { display: none; }

        .chart-process-name {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0 0 4px;
        }
        .chart-process-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin: 0 0 16px;
        }

        #task-chart { height: 380px; width: 100%; }

        /* ── Empty state ── */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }
        .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
        .empty-state p { margin: 0; font-size: 0.95rem; }

        /* ── Modal overlay ── */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }

        .modal {
            background: #161925;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 680px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            animation: modalIn 0.18s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .modal-title { font-size: 1.1rem; font-weight: 600; margin: 0; }
        .modal-close {
            background: none; border: none;
            color: var(--text-muted); font-size: 1.4rem;
            cursor: pointer; line-height: 1;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .modal-close:hover { color: var(--text-main); }

        /* Search input inside modal */
        .modal-search-wrap {
            padding: 14px 24px 0;
            flex-shrink: 0;
        }
        .modal-search {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .modal-search:focus { border-color: var(--accent); }
        .modal-search::placeholder { color: var(--text-muted); }

        /* Process list inside modal */
        .modal-list {
            flex: 1;
            overflow-y: auto;
            padding: 14px 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .modal-list::-webkit-scrollbar { width: 6px; }
        .modal-list::-webkit-scrollbar-track { background: transparent; }
        .modal-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .modal-proc-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            border: 1px solid transparent;
        }
        .modal-proc-row:hover { background: rgba(84,104,255,0.1); border-color: rgba(84,104,255,0.3); }

        .modal-proc-icon {
            font-size: 1.1rem;
            flex-shrink: 0;
            width: 28px; text-align: center;
        }
        .modal-proc-info { flex: 1; min-width: 0; }
        .modal-proc-name {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .modal-proc-path {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }
        .modal-proc-pid {
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .modal-loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* ── Usage bar inline ── */
        .usage-bar {
            height: 4px;
            background: rgba(255,255,255,0.05);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .usage-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.4s ease, background-color 0.3s ease;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            body { padding: 15px; }
            .dashboard-header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .controls-group { width: 100%; }
            .process-metrics { display: none; }
            .modal { max-height: 90vh; }
        }
    </style>
</head>
<body>

    <!-- ═══════════════ HEADER ═══════════════ -->
    <div class="dashboard-header">
        <h1>Task Manager</h1>
        <div class="controls-group">
            <a href="/" class="btn">← Dashboard</a>
            <button class="btn btn-accent" id="add-process-btn" onclick="window.openAddModal()">＋ Add Process</button>
        </div>
    </div>

    <!-- ═══════════════ TRACKED LIST ═══════════════ -->
    <div class="card">
        <div class="card-header">
            <h2 class="card-title">📋 Tracked Processes</h2>
            <span id="process-count" style="font-size:0.8rem;color:var(--text-muted)"></span>
        </div>
        <div id="process-list">
            <div class="empty-state">
                <div class="empty-icon">⏳</div>
                <p>Loading tracked processes…</p>
            </div>
        </div>
    </div>

    <!-- ═══════════════ CHART ═══════════════ -->
    <div class="card" id="chart-section">
        <div class="card-header">
            <div>
                <p class="chart-process-name" id="chart-proc-label">Process</p>
                <h2 class="card-title" id="chart-proc-title">—</h2>
            </div>
            <button class="btn btn-sm" onclick="window.closeChart()">✕ Close</button>
        </div>
        <div id="task-chart"></div>
    </div>

    <!-- ═══════════════ ADD PROCESS MODAL ═══════════════ -->
    <div class="modal-overlay" id="add-modal" onclick="window.closeAddModal(event)">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Add Process to Track</h3>
                <button class="modal-close" onclick="window.closeAddModalDirect()">✕</button>
            </div>
            <div class="modal-search-wrap">
                <input
                    type="text"
                    class="modal-search"
                    id="proc-search"
                    placeholder="Search by name or path…"
                    oninput="window.filterModalList(this.value)"
                    autocomplete="off"
                />
            </div>
            <div class="modal-list" id="modal-proc-list">
                <div class="modal-loading">Loading processes…</div>
            </div>
        </div>
    </div>

    <script src="taskmanager.js"></script>
</body>
</html>
